services:
  superset:
    image: apache/superset:latest
    env:
      # Use your Render Postgres environment variables
      SUPERSET_DATABASE_URI: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
      SUPERSET_SECRET_KEY: "replace-with-a-secure-random-string"
      FLASK_ENV: "production"
      # Gunicorn settings
      WEB_CONCURRENCY: 2
      SUPERSET_WEBSERVER_TIMEOUT: 120
    ports:
      - 8088
    entrypoint: ["/app/entrypoint.sh"]